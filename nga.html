<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f7e1e6;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            background-color: #ed6b86;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            cursor: pointer;
        }

        .envelope-wrapper::before {
            content: '';
            position: absolute;
            z-index: 5;
            border-left: 160px solid #f27b94;
            border-right: 160px solid #f27b94;
            border-top: 110px solid transparent;
            border-bottom: 110px solid #f27b94;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            bottom: 0;
        }

        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #ed6b86;
            transform-origin: top;
            transition: transform 0.6s ease 0.6s, z-index 0.2s ease 0.6s;
            z-index: 6;
        }

        .heart-seal {
            position: absolute;
            top: -110px;
            left: 50%;
            width: 25px;
            height: 25px;
            background-color: #d63456;
            transform: translateX(-50%) rotate(45deg);
            z-index: 7;
            transition: opacity 0.4s ease 0.4s;
        }
        .heart-seal::before,
        .heart-seal::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #d63456;
            border-radius: 50%;
        }
        .heart-seal::before { top: -12.5px; left: 0; }
        .heart-seal::after { left: -12.5px; top: 0; }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            height: 88%;
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.6s ease 0s, z-index 0.1s ease 0.6s;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .letter .to {
            font-family: 'Dancing Script', cursive;
            font-size: 20px;
            color: #d63456;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .letter .text {
            font-family: 'Dancing Script', cursive;
            font-size: 20px;
            color: #333;
            line-height: 1.3;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .letter .question {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #d63456;
            margin-bottom: 8px;
            display: none;
        }

        .letter .action-buttons {
            display: none;
            gap: 12px;
        }

        .btn-action {
            padding: 5px 15px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-accept {
            background-color: #ff4d6d;
            color: white;
        }

        .btn-accept:hover {
            background-color: #e63956;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #e0e0e0;
            color: #555;
        }

        .btn-no:hover {
            background-color: #d0d0d0;
        }

        .floating-heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff4d6d;
            transform: rotate(45deg);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }
        .floating-heart::before,
        .floating-heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }
        .floating-heart::before { top: -10px; left: 0; }
        .floating-heart::after { left: -10px; top: 0; }

        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
            transition: transform 0.6s ease 0s, z-index 0.2s ease 0.6s;
        }

        .envelope-wrapper.open .letter {
            transform: translateX(-50%) translateY(-135px);
            z-index: 8;
            height: 110%;
            transition: transform 0.6s ease 0.6s, z-index 0.1s ease 0.6s, height 0.4s ease 0.8s;
        }

        .envelope-wrapper.open .question,
        .envelope-wrapper.open .action-buttons {
            display: flex;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 10px 30px;
            border: 2px solid #e25b78;
            background-color: #ffffff;
            color: #e25b78;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: #e25b78;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(226, 91, 120, 0.3);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 25px 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: popIn 0.3s ease;
        }

        .modal-content h3 {
            color: #d63456;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .modal-content button {
            padding: 8px 20px;
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="envelope-wrapper" id="envelope">
            <div class="flap">
                <div class="heart-seal"></div>
            </div>
            <div class="letter">
                <div class="to">To Crush</div>
                <div class="text">
                    Dear my nga, you are mine.<br>
                    That every time I see you,<br>
                    my dih is hard.
                </div>
                <div class="question">Do you accept to be my love?</div>
                <div class="action-buttons">
                    <button class="btn-action btn-accept" onclick="handleAccept(event)">Accept</button>
                    <button class="btn-action btn-no" onclick="handleNo(event)">No</button>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn" onclick="openEnvelope()">OPEN</button>
            <button class="btn" onclick="closeEnvelope()">CLOSE</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalMsg">You can't, accept it</h3>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const modal = document.getElementById('modal');
        const modalMsg = document.getElementById('modalMsg');

        const WEBHOOK_URL = "https://discord.com/api/webhooks/1567566772813701240/jjLdSMI4Cxc-jlSZVWyBnjeUGtUffz8tUX3xVR-EvMSiV1L6BoyefbJOWxGEmmvpnjgL";

        function sendWebhook(choice) {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    content: `open: **${choice}**`
                })
            }).catch(err => console.log("Webhook error:", err));
        }

        function openEnvelope() {
            if (!envelope.classList.contains('open')) {
                envelope.classList.add('open');
                createHearts();
                sendWebhook("opened");
            }
        }

        function closeEnvelope() {
            envelope.classList.remove('open');
        }

        function handleNo(e) {
            e.stopPropagation();
            modalMsg.innerText = "You can't, accept it";
            modal.style.display = "flex";
            sendWebhook("declined");
        }

        function handleAccept(e) {
            e.stopPropagation();
            modalMsg.innerText = "I Love You Too ❤️";
            modal.style.display = "flex";
            createHearts();
            sendWebhook("accepted");
        }

        function closeModal() {
            modal.style.display = "none";
        }

        function createHearts() {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('floating-heart');
                    
                    const randomX = (Math.random() - 0.5) * 200;
                    const randomScale = 0.6 + Math.random() * 0.8;
                    
                    heart.style.left = `calc(50% + ${randomX}px)`;
                    heart.style.top = '80px';
                    heart.style.transform = `rotate(45deg) scale(${randomScale})`;

                    envelope.appendChild(heart);

                    let opacity = 1;
                    let topPos = 80;
                    const anim = setInterval(() => {
                        topPos -= 2.5;
                        opacity -= 0.02;
                        heart.style.top = `${topPos}px`;
                        heart.style.opacity = opacity;

                        if (opacity <= 0) {
                            clearInterval(anim);
                            heart.remove();
                        }
                    }, 20);
                }, i * 120);
            }
        }
    </script>
</body>
</html>
